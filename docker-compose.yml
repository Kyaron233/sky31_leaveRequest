version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - sky31
    environment:
      DATABASE_URI: mysql+pymysql://root:sky31admin@db/sky31_leaveRequest

  db:
    image: mariadb:latest
    networks:
      - sky31
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  # 初始化 SQL（仅第一次有效）
      - db_data:/var/lib/mysql   # 持久化 MariaDB 数据
    environment:
      MYSQL_ROOT_PASSWORD: sky31admin
      MYSQL_DATABASE: sky31Employees
      MYSQL_USER: admin
      MYSQL_PASSWORD: sky31admin

  redis:
    image: redis:latest
    networks:
      - sky31

  nginx:
    restart: always
    container_name: nginx-sever
    image: nginx
    volumes:
      # 挂载主配置文件
      - ./nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      # 挂载子配置文件目录
      - ./nginx_conf/conf.d:/etc/nginx/conf.d
      # 挂载日志目录
      - ./log/logs:/var/log/nginx
      # 挂载前端页面
      - ./web:/var/web
    environment:
      - NGINX_PORT=80
      - TZ=Asia/Shanghai
    privileged: true
    # network_mode: host
    ports:
      - "80:80"


volumes:
  db_data:
networks:
  sky31:
