<!DOCTYPE html>

  <head>

    <link rel="stylesheet" href="../css/public.css" />

  <body>
    <header>
      <h1>部门名称</h1>
    </header>
    <div class="container">
      <section>
        <div class="user_data_content">
        <div class="header"><h2>个人信息</h2></div>

          <div class="section">
            <ul class="user_data">
              <li class="name_item">
                <span>姓名丨</span>

              </li>
              <li class="stu_id_item">
                <span>学号丨</span>

              <li class="department_item">
                <span>部门丨</span>

            </ul>
          </div>
          <div class="footer">
            <a href="#modifyPassword">&lt;修改密码&gt;</a>
          </div>
        </div>
        <div class="modify_password_content">
        <div class="header"><h2>个人信息</h2></div>

          <div class="section">
            <ul class="user_data pwd">
              <li class="old_pwd_item">
                <span>原密码丨</span>
                <input type="text" class="old_pswd" />
              </li>
              <li class="new_pwd_item pwd_item">
                <span>新密码丨</span>
                <input type="text" class="new_pswd" />
              </li>
            </ul>
          </div>
          <div class="footer">
            <button class="submit">保存</button>
          </div>
        </div>
      </section>
    </div>

      </section>
    </div>
   
    <footer>
      <ul class="bottom_nav">
        <li id="homepage">
          <div class="icon"></div>

        </li>

        </li>
        <li id="history">

        </li>
        <li id="userpage" class="active">

          <span>我的</span>
        </li>
      </ul>

        <div class="top"></div>
        <div class="bottom">
          <button class="close">确定</button>
        </div>
