server {
    listen 80;

    # 客户端页面
    location /client/ {
        # 使用 alias，将 /client/ 路径替换为 /var/web/client/
        alias /var/web/client/;
        index index.html;
        # 确保单页应用（SPA）的路由可以正常工作
        try_files $uri $uri/ /client/index.html;
    }

    # 管理端页面
    location /administrator/ {
        # 同样使用 alias，将 /administrator/ 路径替换为 /var/web/managementEnd/
        alias /var/web/managementEnd/;
        index index.html;
        try_files $uri $uri/ /administrator/index.html;
    }

    # 公共资源，例如字体等，统一放在 /var/web/
    location /lib/ {
        alias /var/web/lib/;
    }

    location /ChillReunion/ {
        alias /var/web/ChillReunion/;
    }

    location /PingFang/ {
        alias /var/web/PingFang/;
    }

    # API代理
    location /user/ {
        proxy_pass http://127.0.0.1:8000/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}